name: Checks (analyze + tests)

# Fast feedback for work on a branch: analyzer errors and failing tests show up as annotations on the
# run summary, with file and line. Pushes to main run the full APK build instead (tests included).
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze (errors fail the check)
        shell: bash
        run: |
          dart analyze --format=machine > analyze.txt 2>&1 || true
          python3 - <<'PY'
          import os, sys
          errors = warnings = 0
          for line in open('analyze.txt', errors='replace'):
              parts = line.rstrip('\n').split('|')
              if len(parts) < 8 or parts[0] not in ('ERROR', 'WARNING'):
                  continue
              sev, _type, code, path, ln, col = parts[:6]
              msg = '|'.join(parts[7:]).replace('%', '%25')
              level = 'error' if sev == 'ERROR' else 'warning'
              errors += sev == 'ERROR'
              warnings += sev == 'WARNING'
              print(f'::{level} file={os.path.relpath(path)},line={ln},col={col}::{code}: {msg}')
          print(f'Analyzer: {errors} errors, {warnings} warnings')
          sys.exit(1 if errors else 0)
          PY

      - name: Unit tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          flutter test --machine > tests.jsonl 2> tests.err || true
          python3 - <<'PY'
          import json, sys
          names, errors, prints, failed, ok, events = {}, {}, {}, [], None, 0
          for line in open('tests.jsonl', errors='replace'):
              try:
                  ev = json.loads(line)
              except ValueError:
                  continue
              if not isinstance(ev, dict):
                  continue  # flutter also prints [{"event": ...}] daemon lines; not test results
              events += 1
              t = ev.get('type')
              if t == 'testStart':
                  names[ev['test']['id']] = ev['test']['name']
              elif t == 'error':
                  errors.setdefault(ev['testID'], []).append(ev.get('error', ''))
              elif t == 'print':
                  prints.setdefault(ev.get('testID'), []).append(ev.get('message', ''))
              elif t == 'testDone' and ev.get('result') != 'success' and not ev.get('hidden'):
                  failed.append(ev['testID'])
              elif t == 'done':
                  ok = ev.get('success')
          for tid in failed[:20]:
              text = ' | '.join(errors.get(tid, ['failed']))
              # Widget test exceptions are printed, and the error only says "see logs above":
              # put the printed exception (what went wrong, and where) in the annotation instead.
              log = '\n'.join(prints.get(tid, []))
              if 'logs above' in text and log:
                  start = log.find('EXCEPTION CAUGHT')
                  log = log[start:] if start >= 0 else log
                  keep = [l for l in log.splitlines() if l.strip() and not l.startswith('══')
                          and 'package:flutter/' not in l and 'dart:async' not in l]
                  text = '\n'.join(keep)
              text = text[:1500]
              text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=Test failed: {names.get(tid, tid)}::{text}')
          if not failed and ok is not True:
              tail = open('tests.err', errors='replace').read()[-900:]
              last = ''.join(open('tests.jsonl', errors='replace').readlines()[-3:])[-600:]
              text = (tail + '\n---\n' + last).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title=flutter test did not finish cleanly::{text}')
          print(f'::notice title=Test summary::{len(names)} tests started, {len(failed)} failed, '
                f'{events} events, finished={ok}')
          sys.exit(0 if ok and not failed else 1)
          PY
