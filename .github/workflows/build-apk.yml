name: Build Android APK

on:
  workflow_dispatch:        # lets you press "Run workflow" from the GitHub app or site
  push:
    branches: [main]
    tags: ['v*']            # pushing a tag like v0.1.0 also publishes a Release

permissions:
  contents: write           # needed to attach the APK to a Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds our code. Android boilerplate is generated on first run.
      - name: Generate Android platform files (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --project-name jomlah --org my --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      # Release builds have no INTERNET permission by default, so map tiles would fail.
      # The foreground-service permissions keep navigation alive with the screen off.
      # Android 11+ also needs a <queries> entry before an app can find the text-to-speech engine.
      - name: Patch AndroidManifest (permissions, TTS query, app name)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          needed = [
              'INTERNET', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION',
              'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION',
              'POST_NOTIFICATIONS', 'WAKE_LOCK',
          ]
          missing = [n for n in needed if 'android.permission.' + n + '"' not in s]
          if missing:
              block = ''.join(
                  '<uses-permission android:name="android.permission.' + n + '"/>\n    '
                  for n in missing
              )
              s = s.replace('<application', block + '<application', 1)
          if 'TTS_SERVICE' not in s:
              intent = (
                  '<intent>\n'
                  '            <action android:name="android.intent.action.TTS_SERVICE"/>\n'
                  '        </intent>\n'
              )
              if '</queries>' in s:
                  s = s.replace('</queries>', intent + '    </queries>', 1)
              else:
                  s = s.replace('</manifest>', '    <queries>\n        ' + intent + '    </queries>\n</manifest>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Jomlah"', s, count=1)
          p.write_text(s)
          PY

      - run: flutter pub get

      - name: Analyze (informational, does not block the build)
        run: flutter analyze
        continue-on-error: true

      - name: Unit tests
        run: flutter test

      # Optional repo variables (Settings > Secrets and variables > Actions > Variables):
      #   VALHALLA_URL  your own routing server   (unset = public demo server)
      #   PHOTON_URL    your own search server    (unset = public Photon API)
      #   API_URL       your reports backend      (unset = demo mode, fake alerts)
      #
      # Why this step is longer than one command: pubspec.lock is not committed, so every run
      # pulls the newest plugin versions, and those pull in the newest AndroidX libraries.
      # AndroidX raises its minimum compileSdk faster than Flutter's template does, and then
      # Gradle stops at :app:checkReleaseAarMetadata with "...compile against version N or later".
      # Gradle names the exact N, so we read it, set compileSdk to it, and build once more.
      # If the build still fails, the Gradle "What went wrong" text is added to the run summary
      # as an error annotation, so you do not have to dig through the full log.
      - name: Build release APK
        shell: bash
        env:
          VALHALLA_URL: ${{ vars.VALHALLA_URL }}
          PHOTON_URL: ${{ vars.PHOTON_URL }}
          API_URL: ${{ vars.API_URL }}
          REPO: ${{ github.repository }}
        run: |
          args=(--release)
          if [ -n "$VALHALLA_URL" ]; then args+=("--dart-define=VALHALLA_URL=$VALHALLA_URL"); fi
          if [ -n "$PHOTON_URL" ]; then args+=("--dart-define=PHOTON_URL=$PHOTON_URL"); fi
          if [ -n "$API_URL" ]; then args+=("--dart-define=API_URL=$API_URL"); fi
          args+=("--dart-define=FEEDBACK_URL=https://github.com/$REPO/issues")
          args+=("--dart-define=PRIVACY_URL=https://github.com/$REPO/blob/main/PRIVACY.md")

          build() { flutter build apk "${args[@]}" 2>&1 | tee build.log; }

          report_failure() {
            msg=$(awk '/^\* What went wrong:/{f=1;next} /^\* Try:/{f=0} f' build.log \
                  | head -n 15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg:-No Gradle summary found, see the log above.}"
            exit 1
          }

          if build; then exit 0; fi

          if python3 - <<'PY'
          import pathlib, re, sys

          # Gradle wraps long messages across lines, so flatten whitespace before matching.
          log = re.sub(r'\s+', ' ', pathlib.Path('build.log').read_text(errors='replace'))
          wanted = re.findall(r'compile against version (\d+(?:\.\d+)?)', log)
          if not wanted:
              print('Build failed for another reason (no compileSdk request found).')
              sys.exit(1)
          need = max(wanted, key=lambda v: [int(x) for x in v.split('.')])

          changed = False
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              old = p.read_text()
              if '.' not in need:
                  value = 'compileSdk = ' + need
              elif name.endswith('.kts'):      # a point release such as 36.1 needs the platform name
                  value = 'compileSdkVersion("android-%s")' % need
              else:
                  value = 'compileSdkVersion "android-%s"' % need
              new = re.sub(
                  r'(?m)^([ \t]*)compileSdk(?:Version)?\b[ \t]*=?[ \t]*\S.*$',
                  lambda m: m.group(1) + value,
                  old, count=1,
              )
              if new != old:
                  p.write_text(new)
                  changed = True
                  print('Set %s in %s' % (value, name))

          # AGP only warns when compileSdk is newer than it was tested with; this silences it.
          props = pathlib.Path('android/gradle.properties')
          line = 'android.suppressUnsupportedCompileSdk=' + need
          text = props.read_text() if props.exists() else ''
          if line not in text:
              props.write_text(text.rstrip('\n') + '\n' + line + '\n')

          sys.exit(0 if changed else 1)
          PY
          then
            echo "::warning title=compileSdk raised::A dependency needs a newer compileSdk. Retrying the build with it."
            if build; then exit 0; fi
          fi

          report_failure

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jomlah-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
