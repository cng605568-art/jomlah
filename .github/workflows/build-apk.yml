name: Build Android APK

on:
  workflow_dispatch:        # lets you press "Run workflow" from the GitHub app or site
  push:
    branches: [main]
    tags: ['v*']            # pushing a tag like v0.1.0 also publishes a Release

permissions:
  contents: write           # needed to attach the APK to a Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds our code. Android boilerplate is generated on first run.
      - name: Generate Android platform files (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --project-name jomlah --org my --platforms=android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      # Our launcher icon (adaptive icon for Android 8+, rounded square for older phones).
      # android/ is generated, so the icon files live in branding/icon-res and are copied over
      # Flutter's default icon on every run. The manifest already points at @mipmap/ic_launcher.
      - name: Install app icon
        run: cp -r branding/icon-res/. android/app/src/main/res/

      # Release builds have no INTERNET permission by default, so map tiles would fail.
      # The foreground-service permissions keep navigation alive with the screen off.
      # Android 11+ also needs a <queries> entry before an app can find the text-to-speech engine.
      - name: Patch AndroidManifest (permissions, TTS query, app name)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          needed = [
              'INTERNET', 'ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION',
              'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_LOCATION',
              'POST_NOTIFICATIONS', 'WAKE_LOCK',
          ]
          missing = [n for n in needed if 'android.permission.' + n + '"' not in s]
          if missing:
              block = ''.join(
                  '<uses-permission android:name="android.permission.' + n + '"/>\n    '
                  for n in missing
              )
              s = s.replace('<application', block + '<application', 1)
          if 'TTS_SERVICE' not in s:
              intent = (
                  '<intent>\n'
                  '            <action android:name="android.intent.action.TTS_SERVICE"/>\n'
                  '        </intent>\n'
              )
              if '</queries>' in s:
                  s = s.replace('</queries>', intent + '    </queries>', 1)
              else:
                  s = s.replace('</manifest>', '    <queries>\n        ' + intent + '    </queries>\n</manifest>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Jomlah"', s, count=1)
          p.write_text(s)
          PY

      # Release signing. Every runner is a brand-new machine, so without our own key each build would be
      # signed with a new throwaway debug key, and Android refuses to install an update that is signed
      # with a different key. Our key lives in two repository secrets
      # (Settings > Secrets and variables > Actions > Secrets):
      #   ANDROID_KEYSTORE_BASE64    the keystore file jomlah-release.p12, base64 encoded (alias "jomlah")
      #   ANDROID_KEYSTORE_PASSWORD  its password (the same password protects the key)
      # Without them (for example in a fork) the APK is debug-signed and the run shows a warning.
      - name: Set up release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning title=Debug-signed APK::The signing secrets are not set, so this APK uses a throwaway key. Phones must uninstall the old Jomlah before installing it."
            exit 0
          fi
          ks="$RUNNER_TEMP/jomlah-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$ks"
          if ! keytool -list -keystore "$ks" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias jomlah > /dev/null; then
            echo "::error title=Signing key unreadable::Check the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (copy them again from the secrets file)."
            exit 1
          fi
          KS="$ks" python3 - <<'PY'
          import os, pathlib, sys
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text()
          debug = 'signingConfig = signingConfigs.getByName("debug")'
          if debug not in s or '\n    buildTypes {' not in s:
              print('::error title=Signing not applied::android/app/build.gradle.kts no longer looks like the Flutter template, so the release key could not be added.')
              sys.exit(1)
          block = (
              '\n    signingConfigs {\n'
              '        create("release") {\n'
              '            storeFile = file("%s")\n'
              '            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
              '            keyAlias = "jomlah"\n'
              '            keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
              '        }\n'
              '    }\n' % os.environ['KS']
          )
          s = s.replace('\n    buildTypes {', block + '\n    buildTypes {', 1)
          s = s.replace(debug, 'signingConfig = signingConfigs.getByName("release")', 1)
          p.write_text(s)
          print('Release signing configured.')
          PY

      - run: flutter pub get

      - name: Analyze (informational, does not block the build)
        run: flutter analyze
        continue-on-error: true

      - name: Unit tests
        run: flutter test

      # Optional repo variables (Settings > Secrets and variables > Actions > Variables):
      #   VALHALLA_URL  your own routing server   (unset = public demo server)
      #   PHOTON_URL    your own search server    (unset = public Photon API)
      #   API_URL       your reports backend      (unset = demo mode, fake alerts)
      #
      # Why this step is longer than one command: pubspec.lock is not committed, so every run
      # pulls the newest plugin versions, and those pull in the newest AndroidX libraries.
      # AndroidX raises its minimum compileSdk faster than Flutter's template does, and then
      # Gradle stops at :app:checkReleaseAarMetadata with "...compile against version N or later".
      # Gradle names the exact N, so we read it, set compileSdk to it, and build once more.
      # If the build still fails, the Gradle "What went wrong" text is added to the run summary
      # as an error annotation, so you do not have to dig through the full log.
      - name: Build release APK
        shell: bash
        env:
          VALHALLA_URL: ${{ vars.VALHALLA_URL }}
          PHOTON_URL: ${{ vars.PHOTON_URL }}
          API_URL: ${{ vars.API_URL }}
          REPO: ${{ github.repository }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}   # read by Gradle when signing
        run: |
          args=(--release)
          if [ -n "$VALHALLA_URL" ]; then args+=("--dart-define=VALHALLA_URL=$VALHALLA_URL"); fi
          if [ -n "$PHOTON_URL" ]; then args+=("--dart-define=PHOTON_URL=$PHOTON_URL"); fi
          if [ -n "$API_URL" ]; then args+=("--dart-define=API_URL=$API_URL"); fi
          args+=("--dart-define=FEEDBACK_URL=https://github.com/$REPO/issues")
          args+=("--dart-define=PRIVACY_URL=https://github.com/$REPO/blob/main/PRIVACY.md")

          # Version shown in Settings: the tag on release builds ("v1.0.4(BETA)"), otherwise
          # "dev build N" where N is this run's number on the Actions page. Android's version code
          # is the run number, so every build counts up.
          args+=("--build-number=$GITHUB_RUN_NUMBER")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            args+=("--build-name=${BASH_REMATCH[1]}")
            app_version="$GITHUB_REF_NAME"
          else
            app_version="dev build $GITHUB_RUN_NUMBER"
          fi
          args+=("--dart-define=APP_VERSION=$app_version")

          build() { flutter build apk "${args[@]}" 2>&1 | tee build.log; }

          report_failure() {
            msg=$(awk '/^\* What went wrong:/{f=1;next} /^\* Try:/{f=0} f' build.log \
                  | head -n 15 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle build failed::${msg:-No Gradle summary found, see the log above.}"
            exit 1
          }

          if build; then exit 0; fi

          if python3 - <<'PY'
          import pathlib, re, sys

          # Gradle wraps long messages across lines, so flatten whitespace before matching.
          log = re.sub(r'\s+', ' ', pathlib.Path('build.log').read_text(errors='replace'))
          wanted = re.findall(r'compile against version (\d+(?:\.\d+)?)', log)
          if not wanted:
              print('Build failed for another reason (no compileSdk request found).')
              sys.exit(1)
          need = max(wanted, key=lambda v: [int(x) for x in v.split('.')])

          changed = False
          for name in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              p = pathlib.Path(name)
              if not p.exists():
                  continue
              old = p.read_text()
              if '.' not in need:
                  value = 'compileSdk = ' + need
              elif name.endswith('.kts'):      # a point release such as 36.1 needs the platform name
                  value = 'compileSdkVersion("android-%s")' % need
              else:
                  value = 'compileSdkVersion "android-%s"' % need
              new = re.sub(
                  r'(?m)^([ \t]*)compileSdk(?:Version)?\b[ \t]*=?[ \t]*\S.*$',
                  lambda m: m.group(1) + value,
                  old, count=1,
              )
              if new != old:
                  p.write_text(new)
                  changed = True
                  print('Set %s in %s' % (value, name))

          # AGP only warns when compileSdk is newer than it was tested with; this silences it.
          props = pathlib.Path('android/gradle.properties')
          line = 'android.suppressUnsupportedCompileSdk=' + need
          text = props.read_text() if props.exists() else ''
          if line not in text:
              props.write_text(text.rstrip('\n') + '\n' + line + '\n')

          sys.exit(0 if changed else 1)
          PY
          then
            echo "::warning title=compileSdk raised::A dependency needs a newer compileSdk. Retrying the build with it."
            if build; then exit 0; fi
          fi

          report_failure

      # Puts the signing certificate's fingerprint on the run summary. It should be the same on every
      # build; if it changes, phones will refuse the update. Informational only, never fails the build.
      - name: Show signing certificate
        continue-on-error: true
        shell: bash
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          fp=$("${bt}apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk \
               | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          echo "::notice title=APK signing certificate::SHA-256 ${fp:-unknown}"

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jomlah-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Release notes for a tag live in release-notes/<tag>.md (first line "# Title"). When there is no
      # such file, the release keeps whatever title and notes were typed on GitHub's website.
      - name: Find release notes (tags only)
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            first=$(head -n 1 "$f")
            if [[ "$first" == "# "* ]]; then
              echo "title=${first#\# }" >> "$GITHUB_OUTPUT"
              tail -n +2 "$f" > "$RUNNER_TEMP/release-body.md"
            else
              cp "$f" "$RUNNER_TEMP/release-body.md"
            fi
            echo "path=$RUNNER_TEMP/release-body.md" >> "$GITHUB_OUTPUT"
            echo "Using notes from $f"
          else
            echo "No $f; leaving the release text as it is."
          fi

      # Pushing a tag like v1.0.4(BETA) publishes a GitHub Release with the APK attached.
      # Tags with "beta" in them (any case) become pre-releases, like the earlier versions.
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          name: ${{ steps.notes.outputs.title }}
          body_path: ${{ steps.notes.outputs.path }}
