name: Alerts server (Cloudflare)

# Tests the shared-alerts server (worker/) on every change, and on main deploys it to Cloudflare
# Workers once the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets exist.
# The first deploy also creates everything else it needs: the workers.dev address, the D1
# database (in Asia-Pacific) and the secret key used to scramble device ids.
on:
  push:
    paths: ['worker/**', '.github/workflows/alerts-server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alerts-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Server tests (no Cloudflare needed)
        working-directory: worker
        run: node --test test/*.test.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API: https://api.cloudflare.com/client/v4
    defaults:
      run:
        shell: bash
        working-directory: worker
    steps:
      - name: Are the Cloudflare secrets there?
        id: have
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Alerts server not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to put it online."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.have.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.have.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install wrangler (Cloudflare's deploy tool)
        if: steps.have.outputs.ok == 'true'
        run: npm ci

      - name: Check the token
        if: steps.have.outputs.ok == 'true'
        run: |
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          ok=$(curl -sS "${auth[@]}" "$CF_API/user/tokens/verify" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).success)}catch{console.log(false)}})')
          if [ "$ok" != "true" ]; then
            ok=$(curl -sS "${auth[@]}" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).success)}catch{console.log(false)}})')
          fi
          if [ "$ok" != "true" ]; then
            echo "::error title=Cloudflare token not accepted::Check CLOUDFLARE_API_TOKEN: copy the token again (it is shown only once) and paste it into the repository secret."
            exit 1
          fi
          echo "Token OK."

      - name: Make sure the account has a workers.dev address
        if: steps.have.outputs.ok == 'true'
        id: sub
        run: |
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          get() { curl -sS "${auth[@]}" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
                  | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result?.subdomain??"")}catch{console.log("")}})'; }
          sub=$(get)
          if [ -z "$sub" ]; then
            want="jomlah-$(openssl rand -hex 3)"
            curl -sS -X PUT "${auth[@]}" -H 'Content-Type: application/json' \
              -d "{\"subdomain\":\"$want\"}" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" > /dev/null
            sub=$(get)
          fi
          if [ -z "$sub" ]; then
            echo "::error title=No workers.dev address::Open Workers & Pages once in the Cloudflare dashboard (it sets one up), then run this workflow again."
            exit 1
          fi
          echo "sub=$sub" >> "$GITHUB_OUTPUT"
          echo "workers.dev address: $sub.workers.dev"

      - name: Database (created the first time)
        if: steps.have.outputs.ok == 'true'
        run: |
          find_id() { npx wrangler d1 list --json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s).find(x=>x.name==="jomlah-alerts");console.log(d?(d.uuid||d.id||""):"")}catch{console.log("")}})'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx wrangler d1 create jomlah-alerts --location apac
            id=$(find_id)
          fi
          if [ -z "$id" ]; then
            echo "::error title=Could not create the database::Make sure the token has the Account > D1 > Edit permission."
            exit 1
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 migrations apply jomlah-alerts --remote

      - name: Deploy
        if: steps.have.outputs.ok == 'true'
        run: npx wrangler deploy

      - name: Secret key for scrambling device ids (made once, never shown)
        if: steps.have.outputs.ok == 'true'
        run: |
          if npx wrangler secret list 2>/dev/null | grep -q 'HMAC_SECRET'; then
            echo "Secret already set."
          else
            openssl rand -hex 32 | npx wrangler secret put HMAC_SECRET
          fi

      - name: Check it answers
        if: steps.have.outputs.ok == 'true'
        run: |
          url="https://jomlah-alerts.${{ steps.sub.outputs.sub }}.workers.dev"
          # A brand-new workers.dev address can take a few minutes to start answering.
          for i in $(seq 1 24); do
            body=$(curl -sS -m 10 "$url/healthz" || true)
            if echo "$body" | grep -q '"ready":true'; then
              near=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' "$url/v1/reports?lat=3.1579&lng=101.7116")
              echo "::notice title=Alerts server URL::$url"
              echo "Health: $body, nearby: HTTP $near"
              exit 0
            fi
            sleep 10
          done
          echo "::warning title=Alerts server deployed but not answering yet::$url (new addresses can take a few minutes). Last answer: ${body:-none}"
