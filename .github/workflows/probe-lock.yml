name: Probe lockfile (temporary)
on: push
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/probe-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get > pubget.txt 2>&1 || true
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="$RUNNER_TEMP/r"; mkdir -p "$out"; cp pubspec.lock pubget.txt "$out/"; cd "$out"
          git init -q -b probe-results; git config user.name bot; git config user.email bot@users.noreply.github.com
          git add .; git commit -q -m lock; git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-results
