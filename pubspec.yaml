name: jomlah
description: Malaysian-made navigation app (working name).
publish_to: none
version: 1.0.4+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Flutter's own buttons and menus in Malay, English and Chinese
    sdk: flutter
  speech_to_text: ^7.3.0 # voice reports: the phone's own speech recogniser
  flutter_riverpod: ^2.5.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  uuid: ^4.5.1
  http: ^1.2.2
  flutter_tts: ^4.2.0
  shared_preferences: ^2.3.2
  wakelock_plus: ^1.2.0
  url_launcher: ^6.3.0
  permission_handler: '>=11.3.1 <14.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/avatar/
  # Plus Jakarta Sans (SIL Open Font License, see assets/fonts/OFL.txt).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
